<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduDictionary</title>
<style>
:root{--navy:#08243a;--blue:#0784f8;--pale:#eaf5ff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f8fc;color:#123}
header{background:var(--navy);color:white;padding:22px 16px}header h1{margin:0;font-size:28px}header p{margin:8px 0 0}
main{max-width:760px;margin:20px auto;padding:0 14px}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #1231}
input,button{font:inherit;padding:13px;border-radius:10px;border:1px solid #cbdce8;width:100%;margin:6px 0}
button{background:var(--blue);color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:var(--pale);color:#06436b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:13px;color:#536777;line-height:1.5}.status{white-space:pre-wrap;color:#174d22}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📘 EduDictionary</h1><p>LEARN · SEARCH · GROW — English ↔ Hindi</p></header>
<main>
<section class="card">
<h2>Account</h2>
<p class="small">Register or log in to EduDictionary. Confirm your email if Supabase asks you to.</p>
<input id="name" placeholder="Your name (for registration)">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (at least 6 characters)">
<div class="row"><button id="register">Register</button><button class="secondary" id="login">Log in</button></div>
<button class="secondary" id="logout">Log out</button>
<div id="authStatus" class="status small">Connecting to database…</div>
</section>
<section class="card">
<h2>🔎 Word Search</h2>
<input id="word" placeholder="Enter an English word, e.g. book">
<button id="search">Search meaning</button>
<div id="meaning" class="status"></div>
</section>
<section class="card">
<h2>Popular words</h2>
<div class="row"><button class="secondary popular">hello</button><button class="secondary popular">book</button><button class="secondary popular">water</button><button class="secondary popular">love</button></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vtsteizbymamioiwceoc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ShLV_OVqy3Csglcu45Q53w_54jSj0HK";
const authStatus = document.getElementById("authStatus");
let supabaseClient;
try {
  if (!window.supabase || !window.supabase.createClient) throw new Error("Supabase library did not load. Check internet and refresh.");
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  authStatus.textContent = "Database settings added. Try registering or logging in.";
} catch (e) { authStatus.textContent = "Setup error: " + e.message; }

document.getElementById("register").addEventListener("click", async () => {
  if (!supabaseClient) return;
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!name || !email || password.length < 6) { authStatus.textContent = "Enter your name, valid email, and password of at least 6 characters."; return; }
  authStatus.textContent = "Registering…";
  const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
  authStatus.textContent = error ? "Registration error: " + error.message : (data.user && !data.session ? "Account created. Check your email to confirm, then log in." : "Registration successful!");
});
document.getElementById("login").addEventListener("click", async () => {
  if (!supabaseClient) return;
  const email = document.getElementById("email").value.trim(), password = document.getElementById("password").value;
  if (!email || !password) { authStatus.textContent = "Enter your email and password."; return; }
  authStatus.textContent = "Logging in…";
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  authStatus.textContent = error ? "Login error: " + error.message : "Logged in successfully as " + (data.user.email || email);
});
document.getElementById("logout").addEventListener("click", async () => {
  if (!supabaseClient) return;
  const { error } = await supabaseClient.auth.signOut();
  authStatus.textContent = error ? error.message : "Logged out.";
});
async function searchWord(word) {
  const box = document.getElementById("meaning");
  if (!word.trim()) { box.textContent = "Please enter a word."; return; }
  box.textContent = "Searching…";
  try {
    const response = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word.trim()));
    const data = await response.json();
    if (!response.ok || !Array.isArray(data)) { box.textContent = "Meaning not found. Try an English word."; return; }
    const entry = data[0], defs = (entry.meanings || []).flatMap(m => (m.definitions || []).slice(0,2).map(d => "• " + m.partOfSpeech + ": " + d.definition));
    box.textContent = word + "\\n" + defs.slice(0,5).join("\\n");
  } catch(e) { box.textContent = "Could not search right now. Check internet and try again."; }
}
document.getElementById("search").addEventListener("click", () => searchWord(document.getElementById("word").value));
document.getElementById("word").addEventListener("keydown", e => { if(e.key==="Enter") searchWord(e.target.value); });
document.querySelectorAll(".popular").forEach(b => b.addEventListener("click", () => { document.getElementById("word").value=b.textContent; searchWord(b.textContent); }));
</script>
</body>
</html>
